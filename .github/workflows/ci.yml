name: CI

# Pull-request checks. Deployments require an explicit workflow dispatch.
on:
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Verify Assay documentation examples against the public release
        run: node scripts/verify-assay-examples.mjs

      - name: Build
        run: pnpm build

      - name: Check generated production bindings
        run: node scripts/check-deploy-config.mjs production

      - name: Report production client bundle sizes
        run: pnpm bundle:report

      - name: Build staging and verify isolated Worker configuration
        run: |
          pnpm build:staging
          node scripts/check-deploy-config.mjs staging
