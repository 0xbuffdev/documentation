name: CI

# Pull-request checks. Deploys belong to deploy.yml (push to main/staging).
on:
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check generated production bindings
        run: node scripts/check-deploy-config.mjs production

      - name: Report production client bundle sizes
        run: pnpm bundle:report

      - name: Build staging and verify isolated R2 binding
        run: |
          pnpm build:staging
          node scripts/check-deploy-config.mjs staging
