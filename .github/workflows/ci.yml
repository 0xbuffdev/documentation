name: CI

# Pull-request checks. Deploys belong to deploy.yml (push to main/staging).
on:
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      GIT_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4

      # See deploy.yml: the private 0xbuffdev/content dependency must clone
      # over HTTPS with a token on CI runners.
      - name: Configure Git to clone private GitHub deps over HTTPS
        run: |
          git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${GIT_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build
