# Reviewed first-party releases are explicitly pinned below.
# All other dependencies retain pnpm 11's default 24-hour release-age policy.
minimumReleaseAgeExclude:
  - '@0xbuffdev/content-contract@0.1.0'
  - '@0xbuff/throughline@0.0.2'

# Reviewed native toolchain install scripts; unlisted builds remain blocked.
allowBuilds:
  esbuild: true
  workerd: true
